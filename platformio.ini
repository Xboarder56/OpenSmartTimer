[platformio]
default_envs = magbound_v1_esp8266, magbound_v2_esp32c3

[opensmarttimer]
firmware_version = 1.0.0-rc.3
; Experimental remote relay in the V2 image: enabled or disabled. Disabled
; removes its code, API, capability flag and UI section. One build can
; override it with OPENSMARTTIMER_RELAY=enabled|disabled.
relay = enabled

[env:magbound_v1_esp8266]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dout
board_build.f_flash = 40000000L
board_build.ldscript = eagle.flash.4m2m.ld
custom_firmware_artifact = OpenSmartTimer-${opensmarttimer.firmware_version}-MagBoundV1-ESP8266
extra_scripts =
  pre:scripts/build/name_firmware.py
  pre:scripts/build/embed_web_assets.py
  pre:scripts/build/build_identity.py
  pre:scripts/build/build_paths.py
build_flags =
  -D SMART_TIMER_VERSION=\"${opensmarttimer.firmware_version}\"
  -D SMART_TIMER_TARGET_MAGBOUND_V1_ESP8266=1
  -D NO_GLOBAL_EEPROM
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_filter =
  +<*>
  -<BleControlProtocol.cpp>
  ; The experimental relay is V2-only.
  -<relay/>
  -<WebRelay.cpp>

[env:magbound_v2_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
platform_packages =
  framework-arduinoespressif32-libs @ symlink://.framework/esp32c3-libs
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default.csv
board_upload.flash_size = 4MB
custom_firmware_artifact = OpenSmartTimer-${opensmarttimer.firmware_version}-MagBoundV2-ESP32C3
custom_relay = ${opensmarttimer.relay}
; The relay is excluded here and added back by relay_option.py when enabled.
build_src_filter = +<*> -<.git/> -<.svn/> -<relay/> -<WebRelay.cpp>
extra_scripts =
  pre:scripts/build/name_firmware.py
  pre:scripts/build/embed_web_assets.py
  pre:scripts/build/relay_option.py
  pre:scripts/build/build_identity.py
  pre:scripts/build/build_paths.py
build_flags =
  -D SMART_TIMER_VERSION=\"${opensmarttimer.firmware_version}\"
  -D SMART_TIMER_HARDWARE_V2=1
  -D SMART_TIMER_TARGET_MAGBOUND_V2_ESP32C3=1
  -D NO_GLOBAL_EEPROM
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D OPENSMARTTIMER_FRAMEWORK_PROFILE=\"ost-esp32c3-v2\"
  ; The devkit variant's virtual RGB LED (pin 30) would link the RMT driver
  ; into every digitalWrite(); the V2 LEDs are plain GPIOs.
  -D ESP32_ARDUINO_NO_RGB_BUILTIN
