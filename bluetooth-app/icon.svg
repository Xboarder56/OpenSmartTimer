<?xml version="1.0" encoding="UTF-8"?>
<!--
  Home-screen icon. Uses the same lock glyph the local UI puts in the
  topbar brand mark, on the OST purple gradient. 512x512 canvas with
  safe-zone padding so it survives maskable cropping on Android.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1050"/>
      <stop offset="1" stop-color="#0b0710"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d1ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(9) translate(-16 -16)"
     fill="none" stroke="url(#lock)" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 14V9a6 6 0 0 1 12 0v5"/>
    <path d="M8 14h16v13H8z"/>
    <circle cx="16" cy="20" r="2" fill="url(#lock)" stroke="none"/>
  </g>
</svg>
